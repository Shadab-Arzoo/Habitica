name: Build & Publish Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p apk_output
          cp app/build/outputs/apk/debug/app-debug.apk apk_output/RoutineFlow-v1.0-build-${{ github.run_number }}.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoutineFlow-APK-Build-${{ github.run_number }}
          path: apk_output/RoutineFlow-v1.0-build-${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: build-${{ github.run_number }}
          name: "RoutineFlow Build #${{ github.run_number }}"
          body: |
            ## Automated Build #${{ github.run_number }}
            
            📲 **Download Universal APK below** and install directly on your Android device!
            
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
          files: apk_output/RoutineFlow-v1.0-build-${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
